[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-finance"
version = "0.3.5"
description = "Sigma CLI finance tracker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "tomli>=2.0.1; python_version < '3.11'",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/fzunigam/sigma"
Issues = "https://github.com/fzunigam/sigma/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  "build>=1.2.2",
  "twine>=6.1.0",
  "httpx>=0.27.0",
  "pyinstaller>=6.4.0",
]
desktop = [
  "pywebview>=5.1",
]


[project.scripts]
sgm = "sgm.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"sgm" = ["interface/web/static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
