[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-finance"
version = "1.3.0"
description = "Sigma — registro simple de finanzas personales para macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Environment :: MacOS X",
  "Private :: Do Not Upload",
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pywebview>=5.1",
  # For the update check only: the CA bundle to verify github.com with,
  # since the packed interpreter cannot count on finding one on the machine.
  "certifi>=2024.2.2",
]

[project.urls]
Homepage = "https://github.com/fzunigam/sigma"
Issues = "https://github.com/fzunigam/sigma/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  "httpx>=0.27.0",
  "pyinstaller>=6.4.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
"sigma" = ["web/static/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
