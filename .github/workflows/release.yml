name: Release

# Publishes a release with dist/Sigma.app attached as a zip. Triggered by
# pushing a version tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - run: make app

      # ditto, not zip: an .app bundle contains symlinks and resource forks
      # that plain zip flattens, which breaks the app on the other side.
      - run: ditto -c -k --keepParent dist/Sigma.app Sigma.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Sigma.app.zip \
            --title "Sigma ${{ github.ref_name }}" \
            --notes 'Descarga `Sigma.app.zip`, descomprímelo y arrastra **Sigma** a tu carpeta `Aplicaciones`.

          La primera vez macOS pedirá confirmación porque la app no está firmada: clic derecho sobre Sigma → *Abrir*.

          Los cambios de esta versión están en el [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).'
