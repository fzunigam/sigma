version: '3.8'

services:
  sigma-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigma-telegram-bot
    restart: unless-stopped
    volumes:
      # Mount the host user's local configuration and database directory.
      # This allows the containerized bot to read/write the same database file
      # that you interact with via the host CLI.
      - ~/.config/sgm:/root/.config/sgm
      - ~/.local/share/sgm:/root/.local/share/sgm
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
